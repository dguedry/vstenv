<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#16161b"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- a quarter-inch jack plug, the thing every plugin is named after -->
  <g transform="rotate(-40 64 64)">
    <rect x="52" y="14" width="24" height="12" rx="5" fill="#5ac8fa"/>           <!-- tip -->
    <rect x="54" y="26" width="20" height="8" fill="#1e1e24"/>                    <!-- insulator -->
    <rect x="52" y="34" width="24" height="30" fill="#f5f5f7"/>                   <!-- shaft -->
    <rect x="46" y="64" width="36" height="14" rx="3" fill="#f5f5f7"/>            <!-- collar -->
    <rect x="49" y="78" width="30" height="40" rx="9" fill="#5ac8fa"/>            <!-- sleeve/cable -->
  </g>
</svg>
