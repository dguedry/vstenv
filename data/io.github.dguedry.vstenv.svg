<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#16161b"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="112" height="112" rx="26"/></clipPath>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- the V of VST, a bold chevron -->
    <path d="M30 34 L64 96 L98 34" fill="none" stroke="#f5f5f7" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- a waveform riding through it: the audio -->
    <path d="M14 64 C 26 64, 26 44, 38 44 S 50 84, 62 84 S 74 44, 86 44 S 98 84, 110 84 S 122 64, 130 64"
          fill="none" stroke="#5ac8fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
